apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    tailscale.com/expose: "true"
spec:
  ingressClassName: tailscale
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend  # Just the name!
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend # Just the name!
            port:
              number: 80