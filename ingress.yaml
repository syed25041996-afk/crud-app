apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: default # Make sure this matches where your services are
  annotations:
    tailscale.com/expose: "true"
spec:
  ingressClassName: tailscale
  rules:
  - host: home.tail2b1f38.ts.net
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend  # <--- MUST match "kubectl get svc" NAME
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend # <--- MUST match "kubectl get svc" NAME
            port:
              number: 80