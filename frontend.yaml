apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: angular-frontend
        image: your-username/angular-frontend:latest # REPLACE THIS
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80        # Port the Service is exposed on
      targetPort: 80  # Port the Nginx/Angular container listens on
      nodePort: 30000 # Optional: Specific port for NodePort access
  type: NodePort      # Use 'LoadBalancer' if on Cloud (AWS/GCP/Azure)