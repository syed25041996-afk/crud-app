apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: angular-frontend
          image: techfreaksyed/product-app:frontend-v2 # REPLACE THIS
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80 # Port the Service is exposed on
      targetPort: 80 # Port the Nginx/Angular container listens on
  type: LoadBalancer # <-- Changed from ClusterIP
  loadBalancerClass: tailscale # <-- Added Tailscale loadBalancerClass
